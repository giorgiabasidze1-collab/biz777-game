<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Biz777 - Tap & Mini-Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.3); }
        }
        .floating-coin {
            position: absolute;
            color: #ffd700;
            font-weight: 900;
            font-size: 24px;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.8);
            pointer-events: none;
            animation: floatUp 0.7s ease-out forwards;
            z-index: 50;
        }
    </style>
</head>
<body id="gameBody" style="margin: 0; padding: 0; background-color: #0b0c10; color: #ffffff; font-family: sans-serif; height: 100vh; overflow: hidden; user-select: none; -webkit-user-select: none;">

    <!-- Background Decorative Money Symbols -->
    <div style="position: absolute; top: 3%; left: -15px; width: 110px; height: 110px; border-radius: 50%; border: 3px solid #00ff88; color: #00ff88; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 26px; opacity: 0.25; transform: rotate(-25deg); z-index: 1; pointer-events: none;">💵</div>
    <div style="position: absolute; top: 7%; right: -25px; width: 130px; height: 130px; border-radius: 50%; border: 3px solid #ffd700; color: #ffd700; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 30px; opacity: 0.2; transform: rotate(18deg); z-index: 1; pointer-events: none;">€</div>
    <div style="position: absolute; top: 32%; left: -40px; width: 125px; height: 125px; border-radius: 50%; border: 3px solid #00ff88; color: #00ff88; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 28px; opacity: 0.2; transform: rotate(40deg); z-index: 1; pointer-events: none;">💰</div>
    <div style="position: absolute; top: 36%; right: -35px; width: 140px; height: 140px; border-radius: 50%; border: 3px solid #ffd700; color: #ffd700; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 32px; opacity: 0.2; transform: rotate(-35deg); z-index: 1; pointer-events: none;">£</div>
    <div style="position: absolute; bottom: 22%; left: -20px; width: 115px; height: 115px; border-radius: 50%; border: 3px solid #00ff88; color: #00ff88; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 26px; opacity: 0.25; transform: rotate(15deg); z-index: 1; pointer-events: none;">¥</div>
    <div style="position: absolute; bottom: 18%; right: -15px; width: 120px; height: 120px; border-radius: 50%; border: 3px solid #ffd700; color: #ffd700; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 28px; opacity: 0.25; transform: rotate(-12deg); z-index: 1; pointer-events: none;">💵</div>

    <!-- MAIN GAME LAYOUT -->
    <div style="position: relative; z-index: 10; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 20px 0; box-sizing: border-box;">
        
        <!-- HEADER / SCORE -->
        <div style="text-align: center; width: 85%;">
            <div id="score" style="font-size: 48px; font-weight: 900; color: #ffd700; text-shadow: 0 0 12px rgba(255,215,0,0.6);">0</div>
            <div id="levelTitle" style="font-size: 18px; font-weight: bold; color: #00f2fe; margin-top: 5px;">1. Bronze Foundation 🏗️</div>
            
            <!-- PROGRESS BAR -->
            <div style="width: 100%; height: 10px; background: rgba(255,255,255,0.1); border-radius: 10px; margin-top: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2);">
                <div id="progressFill" style="height: 100%; width: 0%; background: #00f2fe; transition: width 0.2s;"></div>
            </div>
        </div>

        <!-- TAP AREA -->
        <div id="tapArea" style="position: relative; width: 210px; height: 210px; background: rgba(255, 255, 255, 0.04); border: 2px dashed #ffd700; border-radius: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation;">
            <div id="buildingIcon" style="font-size: 105px; pointer-events: none; transition: transform 0.05s;">🏗️</div>
        </div>

        <!-- FOOTER / ENERGY & BOOSTS -->
        <div style="width: 85%; text-align: center;">
            <div style="font-size: 15px; font-weight: bold; color: #ffb703; margin-bottom: 5px;">⚡ Energy: <span id="energyText">1000</span> / <span id="maxEnergyText">1000</span></div>
            <div style="width: 100%; height: 10px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; margin-bottom: 12px;">
                <div id="energyFill" style="height: 100%; width: 100%; background: #ffb703;"></div>
            </div>

            <!-- BUTTONS -->
            <div style="display: flex; gap: 8px; justify-content: center; margin-bottom: 8px;">
                <button onclick="watchAd()" style="flex: 1; padding: 10px 2px; background: #2196F3; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 11px;">🎬 Ad (+500⚡)</button>
                <button onclick="inviteFriend()" style="flex: 1; padding: 10px 2px; background: #4CAF50; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 11px;">👥 Invite (+1000⚡)</button>
            </div>
            <button onclick="openMiniGame()" style="width: 100%; padding: 11px; background: linear-gradient(135deg, #f72585, #7209b7); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 13px;">🕹️ Daily Quest (Pass 10 Hands)</button>
        </div>

    </div>

    <!-- MINI-GAME MODAL -->
    <div id="miniGameModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); z-index: 200; flex-direction: column; align-items: center; justify-content: center; padding: 10px; box-sizing: border-box;">
        <div style="width: 100%; max-width: 360px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <div style="color: #ffd700; font-weight: bold; font-size: 15px;">Hands Passed: <span id="questTunnelCount">0</span>/10</div>
            <button onclick="closeMiniGame()" style="background: #ff4757; color: white; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer;">✕ Exit</button>
        </div>
        
        <div style="position: relative; border: 3px solid #00f2fe; border-radius: 12px; overflow: hidden; background: #111;">
            <canvas id="birdCanvas" width="340" height="460" style="display: block; cursor: pointer;"></canvas>
            <div id="gameStartOverlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.7);">
                <h3 style="color: #ffd700; margin: 0 0 10px 0;">✋ Coin & Hands Quest</h3>
                <p style="color: #fff; font-size: 13px; text-align: center; padding: 0 20px; margin-bottom: 15px;">Pass 10 pairs of hands safely to win +500 Energy!</p>
                <button onclick="startBirdGame()" style="padding: 10px 25px; background: #00ff88; color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer;">Start Game</button>
            </div>
        </div>

        <div id="questRewardBox" style="display: none; margin-top: 12px; text-align: center;">
            <p style="color: #00ff88; font-weight: bold; margin: 0 0 8px 0;">🎉 Quest Completed! Pass 10 Hands!</p>
            <button onclick="claimQuestReward()" style="padding: 10px 20px; background: #ffd700; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Claim +500 ⚡ Energy</button>
        </div>
    </div>

    <!-- WIN MODAL -->
    <div id="winModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center;">
        <div style="background: #1a1d24; padding: 25px; border-radius: 20px; text-align: center; border: 2px solid #ffd700; width: 80%;">
            <h2 style="color: #ffd700; margin: 0 0 10px 0;">🎉 Congratulations!</h2>
            <p style="color: #fff; margin: 5px 0;">You built the <b>Biz777 Legend HQ! 👑</b></p>
            <button onclick="document.getElementById('winModal').style.display='none'" style="padding: 10px 20px; background: #ffd700; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Continue</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) tg.expand();

        var score = parseInt(localStorage.getItem("biz777_score")) || 0;
        var energy = parseInt(localStorage.getItem("biz777_energy"));
        if (isNaN(energy)) energy = 1000;
        var maxEnergy = 1000;

        var lastEnergyTime = parseInt(localStorage.getItem("biz777_last_energy_time")) || 0;
        var currentTime = new Date().getTime();
        var twentyFourHours = 24 * 60 * 60 * 1000;

        if (currentTime - lastEnergyTime >= twentyFourHours) {
            energy = maxEnergy;
            localStorage.setItem("biz777_last_energy_time", currentTime);
            saveGame();
        }

        var STAGES = [
            { name: "1. Bronze Foundation", icon: "🏗️", min: 0, max: 1000 },
            { name: "2. Bronze Hut", icon: "🛖", min: 1000, max: 5000 },
            { name: "3. Silver House", icon: "🏡", min: 5000, max: 25000 },
            { name: "4. Silver Villa", icon: "🏠", min: 25000, max: 100000 },
            { name: "5. Gold Office", icon: "🏢", min: 100000, max: 500000 },
            { name: "6. Gold Skyscraper", icon: "🌆", min: 500000, max: 2000000 },
            { name: "7. Diamond Tower", icon: "🏙️", min: 2000000, max: 5000000 },
            { name: "8. Biz777 Legend HQ", icon: "👑", min: 5000000, max: 10000000 }
        ];

        var scoreEl = document.getElementById("score");
        var levelTitleEl = document.getElementById("levelTitle");
        var progressFillEl = document.getElementById("progressFill");
        var buildingIcon = document.getElementById("buildingIcon");
        var energyTextEl = document.getElementById("energyText");
        var maxEnergyTextEl = document.getElementById("maxEnergyText");
        var energyFillEl = document.getElementById("energyFill");
        var tapArea = document.getElementById("tapArea");

        function saveGame() {
            localStorage.setItem("biz777_score", score);
            localStorage.setItem("biz777_energy", energy);
        }

        tapArea.addEventListener("touchstart", function(e) {
            e.preventDefault();
            var touches = e.changedTouches;

            if (energy <= 0) {
                alert("Out of energy! Daily energy refills every 24 hours, or use Invite / Ad / Daily Quest.");
                return;
            }

            var actualTaps = Math.min(touches.length, energy);
            score += actualTaps;
            energy -= actualTaps;
            saveGame();

            for (var i = 0; i < actualTaps; i++) {
                var touch = touches[i];
                var rect = tapArea.getBoundingClientRect();
                var x = touch.clientX - rect.left;
                var y = touch.clientY - rect.top;

                var coin = document.createElement("div");
                coin.className = "floating-coin";
                coin.innerText = "+1";
                coin.style.left = (x - 15) + "px";
                coin.style.top = (y - 20) + "px";
                tapArea.appendChild(coin);

                setTimeout(function(c) {
                    c.remove();
                }, 700, coin);
            }

            buildingIcon.style.transform = "scale(0.88)";
            setTimeout(function() { buildingIcon.style.transform = "scale(1)"; }, 60);

            updateGame();
        }, { passive: false });

        function inviteFriend() {
            var botUsername = "biz_777_bot";
            var inviteLink = "https://t.me/" + botUsername + "?start=ref_" + (tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "user");
            var shareText = "Join Biz777, build your empire and claim your Airdrop! 🚀";
            
            if (tg && tg.openTelegramLink) {
                tg.openTelegramLink("https://t.me/share/url?url=" + encodeURIComponent(inviteLink) + "&text=" + encodeURIComponent(shareText));
            } else {
                alert("Invite link generated!");
            }
        }

        function watchAd() {
            alert("Loading ad...");
            setTimeout(function() {
                energy = Math.min(energy + 500, maxEnergy);
                saveGame();
                updateGame();
                alert("Thank you! +500 ⚡ Energy added!");
            }, 800);
        }

        function updateGame() {
            scoreEl.innerText = score.toLocaleString();
            energyTextEl.innerText = energy;
            maxEnergyTextEl.innerText = maxEnergy;

            var fillPercent = Math.min((energy / maxEnergy) * 100, 100);
            energyFillEl.style.width = fillPercent + "%";

            var currentStage = STAGES[0];
            for (var i = 0; i < STAGES.length; i++) {
                if (score >= STAGES[i].min) {
                    currentStage = STAGES[i];
                }
            }

            levelTitleEl.innerText = currentStage.name;
            buildingIcon.innerText = currentStage.icon;

            var range = currentStage.max - currentStage.min;
            var progress = score - currentStage.min;
            var percent = Math.min((progress / range) * 100, 100);
            progressFillEl.style.width = percent + "%";

            if (score >= 10000000) {
                document.getElementById("winModal").style.display = "flex";
            }
        }

        updateGame();

        // --- MINI-GAME SCRIPT (HANDS OBSTACLE & GOAL: 10) ---
        var canvas = document.getElementById("birdCanvas");
        var ctx = canvas.getContext("2d");
        var birdGameRunning = false;
        var bird, pipes, tunnelScore;
        var questClaimed = localStorage.getItem("biz777_quest_claimed") === "true";

        function openMiniGame() {
            document.getElementById("miniGameModal").style.display = "flex";
            document.getElementById("gameStartOverlay").style.display = "flex";
            document.getElementById("questRewardBox").style.display = "none";
            tunnelScore = 0;
            document.getElementById("questTunnelCount").innerText = tunnelScore;
            resetBirdGame();
        }

        function closeMiniGame() {
            birdGameRunning = false;
            document.getElementById("miniGameModal").style.display = "none";
        }

        function resetBirdGame() {
            bird = { x: 60, y: 220, radius: 18, gravity: 0.45, lift: -7.5, velocity: 0 };
            pipes = [];
        }

        function startBirdGame() {
            if (questClaimed) {
                alert("You have already claimed today's quest reward!");
            }
            document.getElementById("gameStartOverlay").style.display = "none";
            resetBirdGame();
            tunnelScore = 0;
            document.getElementById("questTunnelCount").innerText = tunnelScore;
            birdGameRunning = true;
            loopBirdGame();
        }

        canvas.addEventListener("click", function() {
            if (birdGameRunning) {
                bird.velocity = bird.lift;
            }
        });
        canvas.addEventListener("touchstart", function(e) {
            e.preventDefault();
            if (birdGameRunning) {
                bird.velocity = bird.lift;
            }
        }, { passive: false });

        function loopBirdGame() {
            if (!birdGameRunning) return;

            ctx.fillStyle = "#1e1e2f";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Bird physics
            bird.velocity += bird.gravity;
            bird.y += bird.velocity;

            // Draw Biz777 Coin as Player
            ctx.save();
            ctx.translate(bird.x, bird.y);
            
            ctx.beginPath();
            ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
            ctx.fillStyle = "#ffd700";
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#ffaa00";
            ctx.stroke();

            ctx.fillStyle = "#000";
            ctx.font = "bold 9px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("biz777", 0, 0);
            ctx.restore();

            // Hands generation & rendering
            if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 180) {
                var gapSize = 150;
                var minHeight = 40;
                var maxHeight = canvas.height - gapSize - 80;
                var topH = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
                pipes.push({ x: canvas.width, top: topH, bottom: topH + gapSize, passed: false });
            }

            for (var i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= 2;

                // Draw Hands trying to grab the coin
                ctx.font = "38px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "bottom";
                ctx.fillText("👇", pipes[i].x + 25, pipes[i].top);

                ctx.textBaseline = "top";
                ctx.fillText("👆", pipes[i].x + 25, pipes[i].bottom);

                if (!pipes[i].passed && pipes[i].x + 55 < bird.x) {
                    pipes[i].passed = true;
                    tunnelScore++;
                    document.getElementById("questTunnelCount").innerText = tunnelScore;

                    // Goal is 10 hands passed for 500 energy reward
                    if (tunnelScore >= 10 && !questClaimed) {
                        birdGameRunning = false;
                        document.getElementById("questRewardBox").style.display = "block";
                    }
                }

                if (bird.x + bird.radius > pipes[i].x && bird.x - bird.radius < pipes[i].x + 50) {
                    if (bird.y - bird.radius < pipes[i].top || bird.y + bird.radius > pipes[i].bottom) {
                        endBirdGame();
                    }
                }

                if (pipes[i].x < -60) {
                    pipes.splice(i, 1);
                }
            }

            if (bird.y + bird.radius >= canvas.height || bird.y - bird.radius <= 0) {
                endBirdGame();
            }

            if (birdGameRunning) {
                requestAnimationFrame(loopBirdGame);
            }
        }

        function endBirdGame() {
            birdGameRunning = false;
            document.getElementById("gameStartOverlay").style.display = "flex";
            document.querySelector("#gameStartOverlay h3").innerText = "💥 Caught by Hands!";
            document.querySelector("#gameStartOverlay p").innerText = "Hands passed: " + tunnelScore + "/10. Try again!";
            document.querySelector("#gameStartOverlay button").innerText = "Try Again";
        }

        function claimQuestReward() {
            questClaimed = true;
            localStorage.setItem("biz777_quest_claimed", "true");
            energy = Math.min(energy + 500, maxEnergy);
            saveGame();
            updateGame();
            alert("Success! +500 ⚡ Energy added to your balance!");
            closeMiniGame();
        }
    </script>
</body>
</html>
