<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Biz777 - Tap Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body id="gameBody" style="margin: 0; padding: 0; background-color: #0b0c10; color: #ffffff; font-family: sans-serif; height: 100vh; overflow: hidden; user-select: none; -webkit-user-select: none;">

    <!-- Background Decorative Coins -->
    <div style="position: absolute; top: 3%; left: -15px; width: 110px; height: 110px; border-radius: 50%; border: 3px solid #ffd700; color: #ffd700; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; opacity: 0.3; transform: rotate(-25deg); z-index: 1; pointer-events: none;">BIZ777</div>
    <div style="position: absolute; top: 7%; right: -25px; width: 130px; height: 130px; border-radius: 50%; border: 3px solid #ffd700; color: #ffd700; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; opacity: 0.25; transform: rotate(18deg); z-index: 1; pointer-events: none;">BIZ777</div>
    <div style="position: absolute; top: 32%; left: -40px; width: 125px; height: 125px; border-radius: 50%; border: 3px solid #ffd700; color: #ffd700; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 15px; opacity: 0.2; transform: rotate(40deg); z-index: 1; pointer-events: none;">BIZ777</div>
    <div style="position: absolute; top: 36%; right: -35px; width: 140px; height: 140px; border-radius: 50%; border: 3px solid #ffd700; color: #ffd700; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; opacity: 0.2; transform: rotate(-35deg); z-index: 1; pointer-events: none;">BIZ777</div>
    <div style="position: absolute; bottom: 22%; left: -20px; width: 115px; height: 115px; border-radius: 50%; border: 3px solid #ffd700; color: #ffd700; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; opacity: 0.25; transform: rotate(15deg); z-index: 1; pointer-events: none;">BIZ777</div>
    <div style="position: absolute; bottom: 18%; right: -15px; width: 120px; height: 120px; border-radius: 50%; border: 3px solid #ffd700; color: #ffd700; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 15px; opacity: 0.3; transform: rotate(-12deg); z-index: 1; pointer-events: none;">BIZ777</div>
    <div style="position: absolute; top: 20%; left: 38%; width: 95px; height: 95px; border-radius: 50%; border: 3px solid #ffd700; color: #ffd700; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; opacity: 0.15; transform: rotate(50deg); z-index: 1; pointer-events: none;">BIZ777</div>

    <!-- MAIN GAME LAYOUT -->
    <div style="position: relative; z-index: 10; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 20px 0; box-sizing: border-box;">
        
        <!-- HEADER / SCORE -->
        <div style="text-align: center; width: 85%;">
            <div id="score" style="font-size: 48px; font-weight: 900; color: #ffd700; text-shadow: 0 0 12px rgba(255,215,0,0.6);">0</div>
            <div id="levelTitle" style="font-size: 18px; font-weight: bold; color: #00f2fe; margin-top: 5px;">1. Bronze Foundation 🏗️</div>
            
            <!-- PROGRESS BAR -->
            <div style="width: 100%; height: 10px; background: rgba(255,255,255,0.1); border-radius: 10px; margin-top: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2);">
                <div id="progressFill" style="height: 100%; width: 0%; background: #00f2fe; transition: width 0.2s;"></div>
            </div>
        </div>

        <!-- TAP AREA -->
        <div id="tapArea" style="width: 210px; height: 210px; background: rgba(255, 255, 255, 0.04); border: 2px dashed #ffd700; border-radius: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;">
            <div id="buildingIcon" style="font-size: 105px; pointer-events: none; transition: transform 0.05s;">🏗️</div>
        </div>

        <!-- FOOTER / ENERGY & BOOSTS -->
        <div style="width: 85%; text-align: center;">
            <div style="font-size: 15px; font-weight: bold; color: #ffb703; margin-bottom: 5px;">⚡ Energy: <span id="energyText">1000</span> / <span id="maxEnergyText">1000</span></div>
            <div style="width: 100%; height: 10px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; margin-bottom: 15px;">
                <div id="energyFill" style="height: 100%; width: 100%; background: #ffb703;"></div>
            </div>

            <!-- BUTTONS -->
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button onclick="watchAd()" style="flex: 1; padding: 12px 5px; background: #2196F3; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 12px;">🎬 Ad (+500⚡)</button>
                <button onclick="inviteFriend()" style="flex: 1; padding: 12px 5px; background: #4CAF50; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 12px;">👥 Invite (+1000 Pts)</button>
            </div>
        </div>

    </div>

    <!-- WIN MODAL -->
    <div id="winModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center;">
        <div style="background: #1a1d24; padding: 25px; border-radius: 20px; text-align: center; border: 2px solid #ffd700; width: 80%;">
            <h2 style="color: #ffd700; margin: 0 0 10px 0;">🎉 Congratulations!</h2>
            <p style="color: #fff; margin: 5px 0;">You built the <b>Biz777 Legend HQ! 👑</b></p>
            <p style="color: #00f2fe; margin: 5px 0 15px 0;">Your account is ready for Airdrop!</p>
            <button onclick="document.getElementById('winModal').style.display='none'" style="padding: 10px 20px; background: #ffd700; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Continue</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) tg.expand();

        var score = 0;
        var energy = 1000;
        var maxEnergy = 1000;

        var STAGES = [
            { name: "1. Bronze Foundation", icon: "🏗️", min: 0, max: 1000 },
            { name: "2. Bronze Hut", icon: "🛖", min: 1000, max: 5000 },
            { name: "3. Silver House", icon: "🏡", min: 5000, max: 25000 },
            { name: "4. Silver Villa", icon: "🏠", min: 25000, max: 100000 },
            { name: "5. Gold Office", icon: "🏢", min: 100000, max: 500000 },
            { name: "6. Gold Skyscraper", icon: "🌆", min: 500000, max: 2000000 },
            { name: "7. Diamond Tower", icon: "🏙️", min: 2000000, max: 5000000 },
            { name: "8. Biz777 Legend HQ", icon: "👑", min: 5000000, max: 10000000 }
        ];

        var scoreEl = document.getElementById("score");
        var levelTitleEl = document.getElementById("levelTitle");
        var progressFillEl = document.getElementById("progressFill");
        var buildingIcon = document.getElementById("buildingIcon");
        var energyTextEl = document.getElementById("energyText");
        var maxEnergyTextEl = document.getElementById("maxEnergyText");
        var energyFillEl = document.getElementById("energyFill");
        var tapArea = document.getElementById("tapArea");

        function doTap() {
            if (energy >= 1) {
                score += 1;
                energy -= 1;
                
                buildingIcon.style.transform = "scale(0.88)";
                setTimeout(function() { buildingIcon.style.transform = "scale(1)"; }, 60);

                updateGame();
            } else {
                alert("Out of energy! Invite a friend or watch an ad to refill.");
            }
        }

        tapArea.addEventListener("click", doTap);

        function inviteFriend() {
            var shareText = "Join Biz777, build your empire and claim your Airdrop! 🚀";
            var botUrl = "https://t.me/your_bot_username";
            
            if (tg && tg.openTelegramLink) {
                tg.openTelegramLink("https://t.me/share/url?url=" + encodeURIComponent(botUrl) + "&text=" + encodeURIComponent(shareText));
            } else {
                alert("Invite link copied!");
            }

            score += 1000;
            maxEnergy += 1000;
            energy += 1000;
            updateGame();
            alert("Friend invited! +1000 Points and +1000 ⚡ Energy added!");
        }

        function watchAd() {
            alert("Loading ad...");
            setTimeout(function() {
                maxEnergy += 500;
                energy += 500;
                updateGame();
                alert("Thank you! +500 ⚡ Energy added!");
            }, 800);
        }

        function updateGame() {
            scoreEl.innerText = score.toLocaleString();
            energyTextEl.innerText = energy;
            maxEnergyTextEl.innerText = maxEnergy;

            var fillPercent = Math.min((energy / maxEnergy) * 100, 100);
            energyFillEl.style.width = fillPercent + "%";

            var currentStage = STAGES[0];
            for (var i = 0; i < STAGES.length; i++) {
                if (score >= STAGES[i].min) {
                    currentStage = STAGES[i];
                }
            }

            levelTitleEl.innerText = currentStage.name;
            buildingIcon.innerText = currentStage.icon;

            var range = currentStage.max - currentStage.min;
            var progress = score - currentStage.min;
            var percent = Math.min((progress / range) * 100, 100);
            progressFillEl.style.width = percent + "%";

            if (score >= 10000000) {
                document.getElementById("winModal").style.display = "flex";
            }
        }

        updateGame();
    </script>
</body>
</html>
