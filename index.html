<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Biz777</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.3); }
        }
        .floating-coin {
            position: absolute;
            color: #ffd700;
            font-weight: 900;
            font-size: 24px;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.8);
            pointer-events: none;
            animation: floatUp 0.7s ease-out forwards;
            z-index: 50;
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #0b0c10; color: #ffffff; font-family: sans-serif; height: 100vh; overflow: hidden; user-select: none; -webkit-user-select: none;">

    <!-- MAIN GAME LAYOUT -->
    <div style="position: relative; z-index: 10; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 20px 0; box-sizing: border-box;">
        
        <!-- HEADER / SCORE -->
        <div style="text-align: center; width: 85%;">
            <div id="score" style="font-size: 45px; font-weight: 900; color: #ffd700; text-shadow: 0 0 12px rgba(255,215,0,0.6);">0</div>
            <div style="font-size: 14px; font-weight: bold; color: #00f2fe; margin-top: 3px;">Power: +<span id="tapPowerDisplay">1</span> / Tap</div>
        </div>

        <!-- TAP AREA -->
        <div id="tapArea" style="position: relative; width: 190px; height: 190px; background: rgba(255, 255, 255, 0.04); border: 2px dashed #ffd700; border-radius: 35px; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation;">
            <div id="buildingIcon" style="font-size: 95px; pointer-events: none; transition: transform 0.05s;">🏗️</div>
        </div>

        <!-- FOOTER / ENERGY & BUTTONS -->
        <div style="width: 85%; text-align: center;">
            <div style="font-size: 14px; font-weight: bold; color: #ffb703; margin-bottom: 4px;">⚡ Energy: <span id="energyText">1000</span> / <span id="maxEnergyText">1000</span></div>
            <div style="width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; margin-bottom: 10px;">
                <div id="energyFill" style="height: 100%; width: 100%; background: #ffb703;"></div>
            </div>

            <!-- BUTTONS ROW: SHOP & MINI-GAME -->
            <div style="display: flex; gap: 8px; margin-bottom: 8px;">
                <button onclick="openShop()" style="flex: 1; padding: 14px; background: #00bcd4; color: #000; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 15px;">🛒 Shop</button>
            </div>

            <button onclick="openMiniGame()" style="width: 100%; padding: 11px; background: linear-gradient(135deg, #f72585, #7209b7); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 13px;">🕹️ Hands Mini-Game</button>
        </div>

    </div>

    <!-- SHOP MODAL -->
    <div id="shopModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 999; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box;">
        <div style="width: 100%; max-width: 340px; background: #1a1d24; border: 2px solid #00bcd4; border-radius: 15px; padding: 20px; box-sizing: border-box;">
            <h2 style="color: #00bcd4; margin-top: 0; text-align: center;">🛒 Shop</h2>
            
            <!-- Item 1: +2 Tap -->
            <div style="margin-bottom: 10px; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <div style="font-weight: bold; font-size: 13px;">👆 Power (+2 Tap)</div>
                    <div style="font-size: 11px; color: #ffd700;">Price: 300 Coins</div>
                </div>
                <button onclick="buyUpgrade(2, 300)" style="background: #00ff88; color: #000; border: none; padding: 7px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px;">Buy</button>
            </div>

            <!-- Item 2: +5 Tap -->
            <div style="margin-bottom: 10px; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <div style="font-weight: bold; font-size: 13px;">🔥 Power (+5 Tap)</div>
                    <div style="font-size: 11px; color: #ffd700;">Price: 1,200 Coins</div>
                </div>
                <button onclick="buyUpgrade(5, 1200)" style="background: #00ff88; color: #000; border: none; padding: 7px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px;">Buy</button>
            </div>

            <!-- Item 3: +10 Tap -->
            <div style="margin-bottom: 10px; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <div style="font-weight: bold; font-size: 13px;">⚡ Power (+10 Tap)</div>
                    <div style="font-size: 11px; color: #ffd700;">Price: 4,000 Coins</div>
                </div>
                <button onclick="buyUpgrade(10, 4000)" style="background: #00ff88; color: #000; border: none; padding: 7px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px;">Buy</button>
            </div>

            <!-- Item 4: Refill Energy -->
            <div style="margin-bottom: 15px; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <div style="font-weight: bold; font-size: 13px;">🔋 Energy Refill</div>
                    <div style="font-size: 11px; color: #ffd700;">Price: 200 Coins</div>
                </div>
                <button onclick="buyEnergyRefill()" style="background: #ffb703; color: #000; border: none; padding: 7px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px;">Buy</button>
            </div>

            <button onclick="closeShop()" style="width: 100%; padding: 10px; background: #ff4757; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Close</button>
        </div>
    </div>

    <!-- MINI-GAME MODAL -->
    <div id="miniGameModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); z-index: 999; flex-direction: column; align-items: center; justify-content: center; padding: 10px; box-sizing: border-box;">
        <div style="width: 100%; max-width: 360px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <div style="color: #ffd700; font-weight: bold; font-size: 15px;">Score: <span id="questTunnelCount">0</span></div>
            <button onclick="closeMiniGame()" style="background: #ff4757; color: white; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer;">✕ Exit</button>
        </div>
        
        <div style="position: relative; border: 3px solid #00f2fe; border-radius: 12px; overflow: hidden; background: #111;">
            <canvas id="birdCanvas" width="340" height="460" style="display: block; cursor: pointer;"></canvas>
            <div id="gameStartOverlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.7);">
                <h3 style="color: #ffd700; margin: 0 0 10px 0;">✋ Hands Obstacles</h3>
                <p style="color: #fff; font-size: 13px; text-align: center; padding: 0 20px; margin-bottom: 15px;">Tap screen to fly and avoid hands!</p>
                <button onclick="startBirdGame()" style="padding: 10px 25px; background: #00ff88; color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer;">Start</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) tg.expand();

        var score = parseInt(localStorage.getItem("biz777_score")) || 0;
        var energy = parseInt(localStorage.getItem("biz777_energy"));
        if (isNaN(energy)) energy = 1000;
        var maxEnergy = 1000;
        var tapPower = parseInt(localStorage.getItem("biz777_tap_power")) || 1;

        var scoreEl = document.getElementById("score");
        var tapPowerDisplayEl = document.getElementById("tapPowerDisplay");
        var energyTextEl = document.getElementById("energyText");
        var maxEnergyTextEl = document.getElementById("maxEnergyText");
        var energyFillEl = document.getElementById("energyFill");
        var tapArea = document.getElementById("tapArea");
        var buildingIcon = document.getElementById("buildingIcon");

        function saveGame() {
            localStorage.setItem("biz777_score", score);
            localStorage.setItem("biz777_energy", energy);
            localStorage.setItem("biz777_tap_power", tapPower);
        }

        function handleTapAction(clientX, clientY, targetElement) {
            if (energy < tapPower) return;

            score += tapPower;
            energy -= tapPower;
            saveGame();

            var rect = targetElement.getBoundingClientRect();
            var x = clientX - rect.left;
            var y = clientY - rect.top;

            var coin = document.createElement("div");
            coin.className = "floating-coin";
            coin.innerText = "+" + tapPower;
            coin.style.left = (x - 15) + "px";
            coin.style.top = (y - 20) + "px";
            targetElement.appendChild(coin);

            setTimeout(function(c) {
                c.remove();
            }, 700, coin);

            buildingIcon.style.transform = "scale(0.88)";
            setTimeout(function() { buildingIcon.style.transform = "scale(1)"; }, 60);

            updateGame();
        }

        tapArea.addEventListener("touchstart", function(e) {
            e.preventDefault();
            if (e.changedTouches && e.changedTouches.length > 0) {
                var touch = e.changedTouches[0];
                handleTapAction(touch.clientX, touch.clientY, tapArea);
            }
        }, { passive: false });

        tapArea.addEventListener("click", function(e) {
            handleTapAction(e.clientX, e.clientY, tapArea);
        });

        // Energy recovery over time
        setInterval(function() {
            if (energy < maxEnergy) {
                energy = Math.min(energy + 2, maxEnergy);
                saveGame();
                updateGame();
            }
        }, 1000);

        function updateGame() {
            scoreEl.innerText = score.toLocaleString();
            tapPowerDisplayEl.innerText = tapPower;
            energyTextEl.innerText = energy;
            maxEnergyTextEl.innerText = maxEnergy;

            var fillPercent = Math.min((energy / maxEnergy) * 100, 100);
            energyFillEl.style.width = fillPercent + "%";
        }

        updateGame();

        // --- SHOP LOGIC ---
        function openShop() {
            document.getElementById("shopModal").style.display = "flex";
        }

        function closeShop() {
            document.getElementById("shopModal").style.display = "none";
        }

        function buyUpgrade(powerAdd, cost) {
            if (score >= cost) {
                score -= cost;
                tapPower += powerAdd;
                saveGame();
                updateGame();
                alert("Successfully purchased! Current power: +" + tapPower);
                closeShop();
            } else {
                alert("Not enough coins! Required: " + cost.toLocaleString());
            }
        }

        function buyEnergyRefill() {
            var cost = 200;
            if (score >= cost) {
                score -= cost;
                energy = maxEnergy;
                saveGame();
                updateGame();
                alert("Energy successfully refilled!");
                closeShop();
            } else {
                alert("Not enough coins! Required: 200");
            }
        }

        // --- MINI-GAME LOGIC ---
        var canvas = document.getElementById("birdCanvas");
        var ctx = canvas.getContext("2d");
        var birdGameRunning = false;
        var bird, pipes, tunnelScore, animFrame = 0;

        function openMiniGame() {
            document.getElementById("miniGameModal").style.display = "flex";
            document.getElementById("gameStartOverlay").style.display = "flex";
            tunnelScore = 0;
            document.getElementById("questTunnelCount").innerText = tunnelScore;
            resetBirdGame();
        }

        function closeMiniGame() {
            birdGameRunning = false;
            document.getElementById("miniGameModal").style.display = "none";
        }

        function resetBirdGame() {
            bird = { x: 60, y: 220, radius: 17, gravity: 0.38, lift: -6.8, velocity: 0 };
            pipes = [];
            animFrame = 0;
        }

        function startBirdGame() {
            document.getElementById("gameStartOverlay").style.display = "none";
            resetBirdGame();
            tunnelScore = 0;
            document.getElementById("questTunnelCount").innerText = tunnelScore;
            birdGameRunning = true;
            loopBirdGame();
        }

        canvas.addEventListener("click", function() {
            if (birdGameRunning) { bird.velocity = bird.lift; }
        });
        canvas.addEventListener("touchstart", function(e) {
            e.preventDefault();
            if (birdGameRunning) { bird.velocity = bird.lift; }
        }, { passive: false });

        function drawRoundedHandColumn(x, boundaryHeight, width, isTop) {
            ctx.fillStyle = "#ffdbac";
            ctx.strokeStyle = "#d4a373";
            ctx.lineWidth = 2;

            if (isTop) {
                ctx.fillRect(x, 0, width, boundaryHeight);
                ctx.strokeRect(x, 0, width, boundaryHeight);

                var fingerW = width / 4;
                for (var f = 0; f < 4; f++) {
                    var fx = x + f * fingerW;
                    ctx.beginPath();
                    ctx.roundRect(fx, boundaryHeight, fingerW, 40, [0, 0, 12, 12]);
                    ctx.fill();
                    ctx.stroke();
                }
                ctx.beginPath();
                ctx.roundRect(x - 12, boundaryHeight + 5, 12, 28, [8, 0, 0, 8]);
                ctx.fill();
                ctx.stroke();
            } else {
                var pipeY = boundaryHeight;
                var pipeH = canvas.height - boundaryHeight;
                ctx.fillRect(x, pipeY, width, pipeH);
                ctx.strokeRect(x, pipeY, width, pipeH);

                var fingerW = width / 4;
                for (var f = 0; f < 4; f++) {
                    var fx = x + f * fingerW;
                    ctx.beginPath();
                    ctx.roundRect(fx, pipeY - 40, fingerW, 40, [12, 12, 0, 0]);
                    ctx.fill();
                    ctx.stroke();
                }
                ctx.beginPath();
                ctx.roundRect(x - 12, pipeY - 33, 12, 28, [8, 0, 0, 8]);
                ctx.fill();
                ctx.stroke();
            }
        }

        function loopBirdGame() {
            if (!birdGameRunning) return;

            animFrame++;
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            bird.velocity += bird.gravity;
            bird.y += bird.velocity;

            ctx.beginPath();
            ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
            ctx.fillStyle = "#ffd700";
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#fff";
            ctx.stroke();

            ctx.fillStyle = "#000";
            ctx.font = "bold 8px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("Biz777", bird.x, bird.y);

            if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 205) {
                var gapSize = 195;
                var minHeight = 30;
                var maxHeight = canvas.height - gapSize - 40;
                var topH = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
                pipes.push({ x: canvas.width, top: topH, bottom: topH + gapSize, passed: false });
            }

            for (var i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= 1.8;

                var handOffset = Math.sin(animFrame * 0.05) * 4;
                var topBoundary = pipes[i].top + handOffset;
                var bottomBoundary = pipes[i].bottom - handOffset;

                drawRoundedHandColumn(pipes[i].x, topBoundary, 60, true);
                drawRoundedHandColumn(pipes[i].x, bottomBoundary, 60, false);

                if (!pipes[i].passed && pipes[i].x + 60 < bird.x) {
                    pipes[i].passed = true;
                    tunnelScore++;
                    document.getElementById("questTunnelCount").innerText = tunnelScore;
                }

                var topHitbox = topBoundary + 35;
                var bottomHitbox = bottomBoundary - 35;
                if (bird.x + bird.radius > pipes[i].x && bird.x - bird.radius < pipes[i].x + 60) {
                    if (bird.y - bird.radius < topHitbox || bird.y + bird.radius > bottomHitbox) {
                        endBirdGame();
                    }
                }

                if (pipes[i].x < -70) {
                    pipes.splice(i, 1);
                }
            }

            if (bird.y + bird.radius >= canvas.height || bird.y - bird.radius <= 0) {
                endBirdGame();
            }

            if (birdGameRunning) {
                requestAnimationFrame(loopBirdGame);
            }
        }

        function endBirdGame() {
            birdGameRunning = false;
            document.getElementById("gameStartOverlay").style.display = "flex";
            document.querySelector("#gameStartOverlay h3").innerText = "💥 Game Over!";
            document.querySelector("#gameStartOverlay p").innerText = "Your score: " + tunnelScore + ". Try again!";
            document.querySelector("#gameStartOverlay button").innerText = "Try Again";
        }
    </script>
</body>
</html>
